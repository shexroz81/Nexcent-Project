<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/index.css" />
    <link rel="website icon" type="jpg" href="./images/web-icon.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Nexcent Project</title>
  </head>
  <body>
    <header class="container">
      <div class="navbar">
        <div class="logo">
          <img src="./images/web-icon.jpg" alt="" />
          <h3>Nexcent</h3>
        </div>
        <nav>
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Service</a></li>
            <li><a href="#">Feature</a></li>
            <li><a href="#">Product</a></li>
            <li><a href="#">Testimonials</a></li>
            <li><a href="#">FAQ</a></li>
          </ul>
        </nav>
        <div class="auth-buttons">
          <div class="closed-menu" id="closed-menu">
            <i class="fa-solid fa-bars"></i>
          </div>
          <ul id="nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">Service</a></li>
            <li><a href="#">Feature</a></li>
            <li><a href="#">Product</a></li>
            <li><a href="#">Testimonials</a></li>
            <li><a href="#">FAQ</a></li>
          </ul>
          <a href="#">Login</a>
          <button>Sign up</button>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-container">
          <div class="hero-text">
            <h1>
              Lessons and insights <br />
              <span>from 8 years</span>
            </h1>
            <p>Where to grow your business...</p>
            <button>Register</button>
          </div>
          <div class="hero-image">
            <img src="./images/Illustration.png" alt="" />
          </div>
        </div>
      </section>
      <section class="client">
        <div class="client-container">
          <div class="client-text">
            <h1>Our Clients</h1>
            <p>We have been working with some Fortune 500+ clients</p>
          </div>
          <div class="client-icon">
            <img src="./images/Logo.png" alt="" />
            <img src="./images/Second.png" alt="" />
            <img src="./images/Third Last.png" alt="" />
            <img src="./images/Ipsum.png" alt="" />
            <img src="./images/Fifth.png" alt="" />
            <img src="./images/Six.png" alt="" />
            <img src="./images/Third Last.png" alt="" />
            <img src="./images/Logo.png" alt="" />
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./assets/index.js"></script>
  </body>
</html>
